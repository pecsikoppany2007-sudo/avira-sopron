name: fetch
on:
  push:
    branches: [assets]
    paths: [fetch.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p raw
          while read -r name url; do
            [ -z "$name" ] && continue
            [ -f "raw/$name" ] && continue
            curl -sSL --retry 3 -o "raw/$name" "$url" || echo "fail $name"
          done < fetch.txt
          git config user.name assets-bot && git config user.email assets-bot@users.noreply.github.com
          git add raw && git commit -m "fetch [skip netlify]" && git push || echo nothing
